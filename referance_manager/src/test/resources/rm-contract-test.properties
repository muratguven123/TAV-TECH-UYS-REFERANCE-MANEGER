# ─────────────────────────────────────────────────────────────────────────────
# reference.events — SCC producer contract test (ReferenceEventProducerBase)
# ─────────────────────────────────────────────────────────────────────────────
# The producer base publishes events WITHOUT JSON type headers
# (spring.kafka.producer.properties.spring.json.add.type.headers=false), so the
# ContractVerifierBridgeConfig @KafkaListener that re-delivers the message onto the
# "reference.events" verifier channel MUST be told the target type explicitly.
#
# Without spring.json.value.default.type the JsonDeserializer produces a
# LinkedHashMap, the Message<ReferenceChangedEvent> payload cast fails, nothing is
# forwarded to the QueueChannel, and SCC's contractVerifierMessaging.receive(...)
# returns null -> NullPointerException in the generated Reference_eventsTest.
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.tav.uys.events.ReferenceChangedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=*
